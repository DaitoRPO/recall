
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>Recall — Learn. Remember. Level up.</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #11182b;
      --panel-2: #151e34;
      --panel-3: #1b2740;
      --line: #26334d;
      --text: #f2f5fb;
      --muted: #9aa8c0;
      --accent: #8b9cff;
      --accent-2: #65dfc0;
      --gold: #f2c879;
      --danger: #ff7e91;
      --radius: 18px;
      --shadow: 0 18px 50px rgba(0,0,0,.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: radial-gradient(ellipse at top left, #17213c 0, var(--bg) 44%);
      color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .app { display: grid; grid-template-columns: 245px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      border-right: 1px solid var(--line); padding: 25px 16px; background: rgba(10,15,29,.78);
      display: flex; flex-direction: column; gap: 28px;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px; }
    .brand-mark { width: 38px; height: 38px; object-fit: contain; display:block; flex: 0 0 38px; }
    .brand-name { font-size: 20px; font-weight: 750; letter-spacing: -.7px; }
    .brand-sub { color: var(--muted); font-size: 11px; margin-top: 1px; letter-spacing: .4px; }
    .nav-label { padding: 0 12px; color: #71809a; text-transform: uppercase; letter-spacing: 1.5px; font-size: 10px; font-weight: 800; margin-bottom: 8px; }
    .nav { display:flex; flex-direction:column; gap:5px; }
    .nav-btn { display:flex; align-items:center; gap:12px; width:100%; border:0; background:transparent; color:var(--muted); padding:12px 13px; border-radius:12px; text-align:left; transition:.18s; }
    .nav-btn:hover { background:var(--panel-2); color:var(--text); }
    .nav-btn.active { background:#242e4b; color:#fff; box-shadow: inset 3px 0 var(--accent); }
    .nav-icon { width:20px; text-align:center; font-size:16px; }
    .side-bottom { margin-top:auto; }
    .mini-card { background:linear-gradient(145deg,#192441,#121a2e); border:1px solid var(--line); padding:15px; border-radius:15px; }
    .mini-card strong { display:block; font-size:13px; margin-bottom:5px; }
    .mini-card p { margin:0 0 12px; color:var(--muted); font-size:12px; line-height:1.5; }
    .main { min-width:0; padding: 27px clamp(18px,3vw,42px) 50px; max-width: 1600px; width:100%; margin:0 auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-bottom:30px; }
    .eyebrow { color:var(--muted); font-size:12px; letter-spacing:.3px; margin-bottom:6px; }
    h1 { font-size:clamp(25px,3vw,34px); letter-spacing:-1.1px; margin:0; line-height:1.15; }
    .top-actions { display:flex; align-items:center; gap:10px; }
    .search { width:min(240px,25vw); position:relative; }
    .search input { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 13px 11px 36px; color:var(--text); }
    .search span { position:absolute; left:12px; top:9px; color:var(--muted); }
    .avatar { width:40px; height:40px; border-radius:13px; background:#273454; color:#dbe1ff; display:grid; place-items:center; font-weight:800; border:1px solid #3a486b; }
    .page { display:none; }
    .page.active { display:block; animation:fade .22s ease; }
    @keyframes fade { from {opacity:.45; transform:translateY(4px)} to {opacity:1;transform:none} }
    .grid { display:grid; gap:17px; }
    .stats-grid { grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:20px; }
    .card { background:linear-gradient(145deg,rgba(20,29,50,.98),rgba(16,23,41,.98)); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); min-width:0; }
    .stat-top { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-size:12px; }
    .stat-icon { width:32px; height:32px; display:grid; place-items:center; background:#222e4b; border-radius:10px; font-size:16px; }
    .stat-value { font-size:29px; font-weight:780; letter-spacing:-1px; margin:13px 0 4px; }
    .stat-foot { font-size:11px; color:var(--muted); }
    .accent-text { color:var(--accent-2); }
    .dashboard-grid { grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr); align-items:start; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .section-head h2 { margin:0; font-size:16px; letter-spacing:-.3px; }
    .section-head p { margin:5px 0 0; font-size:12px; color:var(--muted); }
    .text-btn { background:none; border:0; color:var(--accent); font-weight:700; font-size:12px; padding:6px; }
    .text-btn:hover { color:#c2caff; }
    .btn { border:1px solid transparent; background:var(--accent); color:#11172b; font-weight:750; padding:10px 14px; border-radius:11px; transition:.18s; }
    .btn:hover { filter:brightness(1.08); transform:translateY(-1px); }
    .btn.secondary { background:var(--panel-3); color:var(--text); border-color:#33415e; }
    .btn.ghost { background:transparent; color:var(--muted); border-color:var(--line); }
    .btn.danger { background:#442433; color:#ffb5c0; border-color:#623145; }
    .btn.small { font-size:12px; padding:8px 10px; }
    .btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
    .quest-list, .activity-list { display:flex; flex-direction:column; gap:10px; }
    .quest { display:flex; gap:12px; align-items:center; background:#141e33; border:1px solid #25334d; border-radius:13px; padding:13px; }
    .quest-check { flex:0 0 22px; height:22px; border:1.5px solid #52617f; border-radius:7px; display:grid; place-items:center; color:#0c1722; font-size:13px; }
    .quest.done .quest-check { background:var(--accent-2); border-color:var(--accent-2); }
    .quest.done .quest-title { text-decoration:line-through; color:#8e9bb2; }
    .quest-body { flex:1; min-width:0; }
    .quest-title { font-size:13px; font-weight:700; }
    .quest-desc { color:var(--muted); font-size:11px; margin-top:4px; }
    .xp-pill { color:var(--gold); font-size:11px; font-weight:800; white-space:nowrap; }
    .progress-track { height:7px; background:#28334c; border-radius:99px; overflow:hidden; }
    .progress-fill { height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#7d8cff,#67e0c0); transition:width .3s; }
    .level-panel { background:linear-gradient(120deg,#222d4c,#17233b); border:1px solid #34415f; border-radius:16px; padding:18px; margin-bottom:17px; }
    .level-row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    .level-badge { width:47px; height:47px; border-radius:15px; display:grid; place-items:center; background:linear-gradient(145deg,#b9c2ff,#7787ff); color:#11182b; font-weight:900; font-size:19px; }
    .level-title { font-weight:800; font-size:15px; }
    .level-sub { color:var(--muted); font-size:11px; margin-top:4px; }
    .level-xp { font-size:12px; font-weight:700; color:#c8d0ff; }
    .subject-list { display:flex; flex-direction:column; gap:11px; }
    .subject-row { display:flex; align-items:center; gap:12px; }
    .subject-dot { width:39px; height:39px; border-radius:12px; display:grid; place-items:center; font-size:18px; flex-shrink:0; }
    .subject-info { flex:1; min-width:0; }
    .subject-name { font-size:13px; font-weight:750; }
    .subject-meta { font-size:11px; color:var(--muted); margin-top:4px; }
    .subject-percent { color:var(--muted); font-size:11px; }
    .subject-progress { margin-top:7px; }
    .activity-item { display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid #243047; }
    .activity-item:last-child { border-bottom:0; }
    .activity-icon { width:33px; height:33px; display:grid; place-items:center; border-radius:10px; background:#222d47; }
    .activity-text { flex:1; font-size:12px; line-height:1.45; }
    .activity-time { color:var(--muted); font-size:10px; margin-top:3px; }
    .page-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
    .page-toolbar h2 { font-size:20px; margin:0; letter-spacing:-.5px; }
    .page-toolbar p { color:var(--muted); font-size:12px; margin:5px 0 0; }
    .subject-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .subject-card { cursor:pointer; transition:.18s; }
    .subject-card:hover { transform:translateY(-3px); border-color:#47567a; }
    .subject-card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .subject-big-icon { width:47px; height:47px; display:grid; place-items:center; border-radius:14px; font-size:22px; }
    .subject-card h3 { margin:0 0 6px; font-size:16px; }
    .subject-card p { margin:0 0 17px; color:var(--muted); font-size:12px; }
    .subject-card-foot { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:11px; margin-bottom:9px; }
    .flash-layout { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(250px,.8fr); gap:18px; align-items:start; }
    .flashcard { min-height:280px; perspective:1000px; cursor:pointer; }
    .flash-inner { position:relative; min-height:280px; transform-style:preserve-3d; transition:transform .45s; }
    .flashcard.flipped .flash-inner { transform:rotateY(180deg); }
    .flash-face { position:absolute; inset:0; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; border-radius:20px; border:1px solid #3a466a; background:radial-gradient(circle at top right,#2a365a,#141d33 65%); }
    .flash-face.back { transform:rotateY(180deg); background:radial-gradient(circle at top left,#1d514d,#142a35 72%); }
    .flash-label { color:var(--accent); text-transform:uppercase; letter-spacing:1.5px; font-size:10px; font-weight:850; margin-bottom:20px; }
    .flash-face.back .flash-label { color:var(--accent-2); }
    .flash-question { font-size:clamp(19px,2vw,27px); line-height:1.35; font-weight:750; max-width:580px; }
    .flash-hint { color:var(--muted); font-size:11px; margin-top:25px; }
    .flash-controls { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:15px; flex-wrap:wrap; }
    .flash-count { color:var(--muted); font-size:12px; min-width:60px; text-align:center; }
    .empty { text-align:center; padding:38px 20px; color:var(--muted); }
    .empty .empty-icon { font-size:30px; margin-bottom:12px; }
    .empty h3 { color:var(--text); margin:0 0 7px; font-size:16px; }
    .empty p { font-size:12px; line-height:1.6; max-width:360px; margin:0 auto 16px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    .field { display:flex; flex-direction:column; gap:7px; min-width:0; }
    .field.full { grid-column:1/-1; }
    .field label { color:#c1cbe0; font-size:12px; font-weight:700; }
    .field input, .field textarea, .field select { width:100%; background:#0e1526; color:var(--text); border:1px solid #2c3955; border-radius:10px; padding:11px 12px; }
    .field textarea { resize:vertical; min-height:90px; }
    .field input::placeholder, .field textarea::placeholder { color:#66748e; }
    .form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(3,6,14,.76); z-index:20; display:none; align-items:center; justify-content:center; padding:18px; }
    .modal-backdrop.open { display:flex; }
    .modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:#111a2d; border:1px solid #34415d; border-radius:20px; padding:22px; box-shadow:0 30px 100px #0008; }
    .modal-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; }
    .modal-head h2 { margin:0; font-size:19px; }
    .icon-btn { border:1px solid var(--line); background:#1b2740; color:var(--muted); width:34px; height:34px; border-radius:10px; }
    .quiz-layout { display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:18px; align-items:start; }
    .quiz-option { display:block; width:100%; text-align:left; background:#151f34; border:1px solid #2c3a57; color:var(--text); padding:14px; border-radius:12px; margin-top:9px; }
    .quiz-option:hover:not(:disabled) { border-color:#8392ff; background:#202b47; }
    .quiz-option.correct { border-color:#55d6b4; background:#143d3b; }
    .quiz-option.incorrect { border-color:#ff7e91; background:#432331; }
    .quiz-feedback { margin-top:14px; padding:12px; border-radius:10px; font-size:12px; line-height:1.5; display:none; }
    .quiz-feedback.show { display:block; }
    .quiz-feedback.good { background:#143d35; color:#a5f0dc; }
    .quiz-feedback.bad { background:#432331; color:#ffc1cb; }
    .quiz-top { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:16px; }
    .quiz-question { font-size:20px; font-weight:750; line-height:1.4; margin-bottom:16px; }
    .achievement-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .achievement { text-align:center; padding:20px 13px; }
    .achievement-icon { font-size:28px; margin-bottom:11px; filter:grayscale(1); opacity:.5; }
    .achievement.unlocked .achievement-icon { filter:none; opacity:1; }
    .achievement h3 { margin:0 0 6px; font-size:13px; }
    .achievement p { margin:0; color:var(--muted); font-size:11px; line-height:1.5; }
    .achievement-status { display:inline-block; margin-top:12px; font-size:10px; color:var(--muted); padding:4px 8px; border-radius:99px; background:#202a40; }
    .achievement.unlocked .achievement-status { color:#9cebd7; background:#183b3a; }
    .test-list { display:flex; flex-direction:column; gap:10px; }
    .test-item { display:flex; align-items:center; gap:13px; padding:14px; border:1px solid var(--line); border-radius:13px; background:#141e32; }
    .test-date { width:48px; height:51px; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#25314f; flex-shrink:0; }
    .test-date strong { font-size:18px; }
    .test-date span { font-size:9px; color:var(--muted); text-transform:uppercase; }
    .test-main { flex:1; min-width:0; }
    .test-main strong { font-size:13px; }
    .test-main p { margin:4px 0 0; font-size:11px; color:var(--muted); }
    .test-days { font-size:11px; color:var(--gold); font-weight:750; white-space:nowrap; }
    .toast { position:fixed; bottom:22px; right:22px; z-index:40; background:#d8e0ff; color:#11172a; padding:13px 17px; border-radius:12px; font-size:13px; font-weight:750; box-shadow:0 12px 35px #0005; opacity:0; transform:translateY(12px); pointer-events:none; transition:.25s; }
    .toast.show { opacity:1; transform:none; }
    .muted { color:var(--muted); }
    .tiny { font-size:11px; color:var(--muted); }
    .row { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .spacer { flex:1; }
    .divider { height:1px; background:var(--line); margin:17px 0; }
    .notice { padding:12px 14px; border-radius:12px; background:#202b43; border:1px solid #33415d; color:#c3cce0; font-size:11px; line-height:1.6; margin-top:14px; }
    .footer-note { color:#66748e; font-size:10px; text-align:center; margin-top:25px; }
    @media (max-width:1100px) {
      .stats-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .dashboard-grid { grid-template-columns:1fr; }
      .subject-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .achievement-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:760px) {
      .app { grid-template-columns:1fr; }
      .sidebar { padding:12px; border-right:0; border-bottom:1px solid var(--line); gap:12px; }
      .brand { padding:0 5px; }
      .sidebar .nav-label, .side-bottom { display:none; }
      .nav { flex-direction:row; overflow-x:auto; padding-bottom:2px; }
      .nav-btn { width:auto; flex-shrink:0; padding:10px 12px; font-size:12px; }
      .nav-icon { width:auto; }
      .main { padding:20px 14px 35px; }
      .topbar { align-items:flex-start; margin-bottom:22px; }
      .search { display:none; }
      .dashboard-grid, .flash-layout, .quiz-layout { grid-template-columns:1fr; }
      .subject-grid { grid-template-columns:1fr; }
      .stats-grid { gap:10px; }
      .card { padding:16px; border-radius:15px; }
      .stat-value { font-size:25px; }
      .form-grid { grid-template-columns:1fr; }
      .field.full { grid-column:auto; }
      .test-item { align-items:flex-start; }
      .test-days { white-space:normal; text-align:right; }
    }
    @media (max-width:420px) {
      .stats-grid { grid-template-columns:1fr 1fr; }
      .stat-top { font-size:10px; }
      .stat-icon { width:28px; height:28px; }
      .stat-value { font-size:23px; }
      .achievement-grid { grid-template-columns:1fr 1fr; }
      .topbar h1 { font-size:25px; }
      .avatar { width:35px; height:35px; }
    }
  </style>
</head>
